<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>SCP: Secret Laboratory — Web Edition</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

<!-- ═══════════ 主菜单 ═══════════ -->
<div id="main-menu">
  <div class="menu-bg"></div>
  <div class="menu-content">
    <div class="logo">
      <div class="logo-main">SCP</div>
      <div class="logo-sub">SECRET LABORATORY</div>
      <div class="logo-version">Web Edition v0.4 · 邀请码联机</div>
    </div>

    <!-- 单人模式 -->
    <div class="menu-section">
      <button id="btn-single" class="btn btn-primary btn-large">
        <span class="btn-icon">🎮</span> 单人 · AI 开局
      </button>
      <p class="hint">直接开局，AI 自动填充所有阵营</p>
    </div>

    <div class="menu-divider"><span>多人联机</span></div>

    <!-- 多人 Tab -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="create">创建房间</button>
      <button class="tab-btn" data-tab="join">加入房间</button>
      <button class="tab-btn" data-tab="list">浏览房间</button>
    </div>

    <!-- 创建房间 -->
    <div class="tab-panel active" id="tab-create">
      <input type="text" id="room-name" placeholder="房间名称（可选）" maxlength="20">
      <input type="password" id="room-pwd" placeholder="房间密码（可选）" maxlength="10">
      <button id="btn-create-room" class="btn btn-success">创建并开局</button>
      <div id="room-created-info" class="hidden">
        <p class="success">✓ 房间创建成功！</p>
        <div class="room-code-display">
          <span class="code-label">房间码</span>
          <span id="display-code" class="code-value"></span>
          <button id="btn-copy-code" class="btn-small">复制</button>
        </div>
        <div class="invite-link-display">
          <span class="code-label">邀请链接</span>
          <input type="text" id="display-invite-url" readonly>
          <button id="btn-copy-invite" class="btn-small">复制</button>
        </div>
        <p class="hint">把房间码或链接发给朋友即可加入</p>
      </div>
    </div>

    <!-- 加入房间 -->
    <div class="tab-panel" id="tab-join">
      <input type="text" id="join-code" placeholder="输入 6 位房间码" maxlength="6">
      <input type="password" id="join-pwd" placeholder="密码（如有）" maxlength="10">
      <button id="btn-join-room" class="btn btn-info">加入房间</button>
      <p id="join-error" class="error hidden"></p>
    </div>

    <!-- 房间列表 -->
    <div class="tab-panel" id="tab-list">
      <div class="list-header">
        <span>可加入的房间</span>
        <button id="btn-refresh-rooms" class="btn-small">刷新</button>
      </div>
      <div id="room-list-container"><p class="hint">点击刷新查看房间</p></div>
    </div>

    <!-- 房间内等待 -->
    <div id="room-waiting" class="hidden">
      <h3>房间：<span id="waiting-room-name"></span></h3>
      <p class="room-code-display">房间码 <span id="waiting-code" class="code-value"></span></p>
      <div class="player-list">
        <h4>玩家（<span id="player-count">1</span>/20）</h4>
        <ul id="players-ul"></ul>
      </div>
      <div class="room-actions">
        <button id="btn-start-game" class="btn btn-primary hidden">开始游戏</button>
        <button id="btn-leave-room" class="btn btn-danger">离开房间</button>
      </div>
    </div>

    <div class="menu-divider"><span>阵营与角色</span></div>
    <div class="faction-tabs">
      <button class="faction-btn active" data-faction="ntf">九尾狐 NTF</button>
      <button class="faction-btn" data-faction="chaos">混沌分裂者</button>
      <button class="faction-btn" data-faction="scp">SCP 实体</button>
    </div>
    <div class="role-select" id="role-select"></div>

    <div class="menu-footer">
      <span>WASD 移动 · 鼠标转向 · 左键开火 · R 换弹 · E 交互 · Esc 释放鼠标</span>
    </div>
  </div>
</div>

<!-- ═══════════ 游戏画布 ═══════════ -->
<canvas id="renderCanvas" class="hidden"></canvas>

<!-- ═══════════ HUD ═══════════ -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hp-wrap">
      <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
      <span id="hp-text">100</span>
    </div>
    <div class="ammo" id="ammo-display">30 / 120</div>
  </div>
  <div class="hud-center">
    <div class="crosshair">＋</div>
  </div>
  <div class="hud-bottom">
    <div class="role-display" id="role-display">NTF Private</div>
    <div class="card-display" id="card-display">门卡 Lv.1</div>
  </div>

  <!-- 手机触控 -->
  <div class="mobile-controls hidden" id="mobile-controls">
    <div class="joystick" id="joystick"><div class="joystick-knob" id="joystick-knob"></div></div>
    <div class="touch-look" id="touch-look"></div>
    <div class="touch-buttons">
      <button class="touch-btn" id="btn-fire">🔥</button>
      <button class="touch-btn" id="btn-reload">↻</button>
      <button class="touch-btn" id="btn-interact">🖐</button>
      <button class="touch-btn" id="btn-jump">↑</button>
    </div>
  </div>
</div>

<!-- ═══════════ 死亡观战 ═══════════ -->
<div id="spectate" class="hidden">
  <h2>你已阵亡</h2>
  <p id="spec-text">正在观战中…</p>
  <button id="btn-respawn" class="btn">等待复活</button>
</div>

<!-- ═══════════ 通知 ═══════════ -->
<div id="announcements"></div>

<script type="module" src="game/main.js"></script>
</body>
</html>
